<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P6 · Room cools — Rosewood Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/styles.css">
<style>
  body.slide-p6 .tele-row.r1,
  body.slide-p6 .tele-row.r2,
  body.slide-p6 .tele-row.r3 { opacity: 1; transform: none; }
  body.slide-p6 .tele-row.r3 { opacity: 0; transform: translateX(18px); }
  body.slide-p6.step-1 .tele-row.r3 { opacity: 1; transform: none; transition-delay: 0.4s; }
  body.slide-p6 .ac-temp .reading .digits { display: inline-block; }
  body.slide-p6.step-0 .ac-temp .reading .digits { color: var(--text); }
  body.slide-p6.step-0 .ac-meta .pill { background: var(--brand-soft); color: var(--brand); border-color: var(--brand-line); }
  body.slide-p6.step-1 .ac-meta .pill { background: var(--green-soft); color: var(--green); border-color: rgba(15, 118, 110, 0.22); }
</style>
</head>
<body
  class="slide-p6"
  data-steps="1"
  data-prev="p5.html"
  data-next="p7.html"
  data-mode="Server"
  data-tag="During"
  data-phase="Room cools"
  data-index="6"
  data-total="12">

<div class="stage split-50">
  <!-- Left: HVAC unit graphic -->
  <div class="pane">
    <div style="display:grid; place-items:center; width:100%; height:100%;">
      <div class="ac-unit">
        <div class="ac-temp">
          <div class="reading"><span class="digits">67</span><sup>°F</sup></div>
          <div class="label">Vineyard Suite · target</div>
        </div>
        <div class="ac-meta">
          <span>HVAC · auto · Reventel signal</span>
          <span class="pill">cooled · ready</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Right: telemetry now with a third row from sensor -->
  <div class="pane surface">
    <div class="telemetry">
      <h5>Telemetry · stay stream</h5>
      <div class="tele-row staff r1">
        <div class="dot"></div>
        <div class="body">
          <strong>Heavy luggage observed</strong>
          <small>Staff · Marco · 2:04 PM</small>
        </div>
      </div>
      <div class="tele-row staff r2">
        <div class="dot"></div>
        <div class="body">
          <strong>Likely dehydrated · F&amp;B alerted</strong>
          <small>Staff · Marco · 2:04 PM · routed F&amp;B</small>
        </div>
      </div>
      <div class="tele-row sensor r3">
        <div class="dot"></div>
        <div class="body">
          <strong>Room cooled to 67°F · welcome temp</strong>
          <small>Sensor · HVAC · 2:06 PM · auto-set per profile</small>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../shared/slide.js"></script>
</body>
</html>
